<!DOCTYPE html>
<html>
<head>
    <title>Reel Hook Generator</title>
</head>
<body>
    <h2>Instagram Reel Hook Generator</h2>

    <form method="POST">
        <input type="text" name="topic" placeholder="Enter your topic">
        <br><br>

        <select name="tone">
            <option value="motivational">Motivational</option>
            <option value="funny">Funny</option>
            <option value="serious">Serious</option>
        </select>
        <br><br>

        <button type="submit">Generate Hook</button>
    </form>
    {% if result %}
    <h3>Your Generated Hook:</h3>
    <p>{{ result }}</p>
{% endif %}
</body>
</html>
