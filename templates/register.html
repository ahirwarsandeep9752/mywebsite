<!DOCTYPE html>
<html>
<head>
    <title>Register - AI Hook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            text-align: center;
            padding: 60px;
        }

        .box {
            background: #1e293b;
            max-width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #cbd5f5;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            font-size: 15px;
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        .msg {
            margin-top: 15px;
            color: #f87171;
            font-size: 14px;
        }

        .terms {
            font-size: 13px;
            color: #94a3b8;
            text-align: left;
            margin-top: 10px;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        .show {
            font-size: 13px;
            cursor: pointer;
            color: #94a3b8;
        }
    </style>

    <script>
        function togglePassword() {
            var x = document.getElementById("password");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }
    </script>
</head>

<body>

<div class="box">
    <h1>Create your account</h1>
    <p>Start using AI Hook for free</p>

    <form method="POST">
        <input type="text" name="username" placeholder="Choose a username" required>

        <input type="email" name="email" placeholder="Enter your email" required>

        <input type="password" id="password" name="password" placeholder="Create password" required>

        <div class="show" onclick="togglePassword()">Show / Hide password</div>

        <div class="terms">
            <input type="checkbox" required>
            I agree to the Terms & Privacy Policy
        </div>

        <button type="submit">Create Account</button>
    </form>

    {% if message %}
        <div class="msg">{{ message }}</div>
    {% endif %}

    <p style="margin-top:20px;">
        Already have an account? <a href="/">Login</a>
    </p>
</div>

</body>
</html>
