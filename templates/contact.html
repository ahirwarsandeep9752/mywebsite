<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <style>
        body {background:#0f172a;color:white;font-family:Arial;text-align:center;padding:60px;}
        .box {background:#1e293b;max-width:400px;margin:auto;padding:40px;border-radius:10px;}
        input,textarea {width:90%;padding:10px;margin:10px;border-radius:5px;border:none;}
        button {padding:12px 30px;background:#38bdf8;border:none;font-weight:bold;}
    </style>
</head>
<body>
<div class="box">
    <h1>Contact Us</h1>
    <form method="POST">
        <input name="name" placeholder="Name" required>
        <input name="email" placeholder="Email" required>
        <textarea name="message" placeholder="Message" required></textarea>
        <br>
        <button type="submit">Send</button>
    </form>
    {% if msg %}<p style="color:#22c55e">{{ msg }}</p>{% endif %}
</div>
</body>
</html>
