<!DOCTYPE html>
<html>
<head>
    <title>Login - AI Hook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 80px;
        }

        .box {
            background: #1e293b;
            max-width: 400px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
        }

        input 
input{
            width: 80%;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>AI Hook</h1>
    <p>Login to your account</p>

    {% if message %}
        <p style="color:red;">{{ message }}</p>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>

    <p style="margin-top:20px;">
        New user? <a href="/register">Create account</a>
    </p>
</div>

</body>
</html>
